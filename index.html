<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Drafter AI Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
        }
        .loading-spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #4f46e5;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="p-6">

    <div class="glass-card w-full max-w-4xl overflow-hidden flex flex-col md:flex-row min-h-[600px] md:h-[600px]">
    
    <div class="w-full md:w-1/3 bg-indigo-600 p-6 text-white flex flex-col justify-between">
        <div>
            <h1 class="text-2xl font-bold mb-2">✉️ EmailAI</h1>
            <p class="text-indigo-200 text-sm">Powered by Ollama & Google ADK</p>
            <div class="mt-8">
                <div id="statusIndicator" class="flex items-center space-x-2 text-sm bg-indigo-700 p-2 rounded-lg">
                    <div class="w-3 h-3 bg-yellow-400 rounded-full animate-pulse" id="statusDot"></div>
                    <span id="statusText">Connecting to Server...</span>
                </div>
            </div>
        </div>
        <div class="text-xs text-indigo-300 mt-4 md:mt-0">
            Session Memory: Active <br>
            Model: Llama 3
        </div>
    </div>

    <div class="w-full md:w-2/3 p-6 md:p-8 flex flex-col overflow-y-auto">
        <h2 class="text-xl font-semibold text-gray-800 mb-4">New Email Draft</h2>
        
        <textarea id="userInput" 
            rows="5"
            class="w-full min-h-[150px] p-4 border border-gray-200 rounded-xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all text-gray-700"
            placeholder="Describe the situation (e.g. Requesting a sick leave from my boss Mr. Khan)..."></textarea>
        
        <button onclick="sendRequest()" id="genBtn"
            class="mt-4 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-xl transition-all transform hover:scale-[1.02] active:scale-95 shadow-lg flex justify-center items-center">
            <span>Generate Professional Email</span>
        </button>

        <div id="resultContainer" class="mt-8 hidden space-y-4 pb-6">
            <div class="flex justify-between items-center">
                <h3 class="text-gray-500 text-sm font-bold uppercase tracking-wider">AI Generated Draft</h3>
                <button onclick="copyToClipboard()" class="text-indigo-600 text-xs font-semibold hover:underline">Copy All</button>
            </div>
            <div class="bg-gray-50 p-4 rounded-xl border border-gray-100 shadow-inner">
                <div class="mb-2 text-indigo-700 font-bold" id="resSubject"></div>
                <div class="text-gray-700 text-sm leading-relaxed" id="resBody"></div>
                <div class="mt-4 font-semibold text-gray-800" id="resClosing"></div>
            </div>
        </div>

        <div id="loader" class="mt-12 hidden flex-col items-center">
            <div class="loading-spinner"></div>
            <p class="mt-2 text-gray-500 text-sm animate-pulse">Llama 3 is thinking...</p>
        </div>
    </div>
</div>

    <script>
        const ws = new WebSocket("ws://localhost:8000/ws");
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');

        ws.onopen = () => {
            statusText.innerText = "Connected to Agent";
            statusDot.classList.replace('bg-yellow-400', 'bg-green-400');
            statusDot.classList.remove('animate-pulse');
        };

        ws.onclose = () => {
            statusText.innerText = "Connection Lost";
            statusDot.classList.replace('bg-green-400', 'bg-red-500');
        };

        function sendRequest() {
            const input = document.getElementById('userInput').value;
            if (!input) return alert("Please enter a situation!");

            // UI Changes
            document.getElementById('resultContainer').classList.add('hidden');
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('genBtn').disabled = true;
            document.getElementById('genBtn').style.opacity = '0.7';

            ws.send(input);
        }

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            
            // UI Restoration
            document.getElementById('loader').classList.add('hidden');
            document.getElementById('resultContainer').classList.remove('hidden');
            document.getElementById('genBtn').disabled = false;
            document.getElementById('genBtn').style.opacity = '1';

            // Populate Data
            document.getElementById('resSubject').innerText = "Subject: " + (data.subject || "No Subject");
            document.getElementById('resBody').innerText = data.body || "No Body Generated";
            document.getElementById('resClosing').innerText = data.closing || "Best regards,";
        };

        function copyToClipboard() {
            const subject = document.getElementById('resSubject').innerText;
            const body = document.getElementById('resBody').innerText;
            const closing = document.getElementById('resClosing').innerText;
            const fullEmail = `${subject}\n\n${body}\n\n${closing}`;
            
            navigator.clipboard.writeText(fullEmail).then(() => {
                alert("Email copied to clipboard!");
            });
        }
    </script>
</body>
</html>
