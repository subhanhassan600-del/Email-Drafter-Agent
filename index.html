<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentHub - AI Factory</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 24px; box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2); }
        .nav-btn { transition: all 0.3s ease; border-left: 4px solid transparent; }
        .nav-btn.active { background: rgba(255, 255, 255, 0.15); border-left: 4px solid white; opacity: 1; }
        .loading-spinner { border: 4px solid rgba(0, 0, 0, 0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #4f46e5; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 10px; }
        #resBody h1, #resBody h2, #resBody h3 { font-weight: 800; margin-top: 1rem; color: #1e1b4b; }
        #resBody ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1rem; }
        #resBody p { margin-bottom: 0.8rem; }
        #resBody strong { color: #4338ca; }
        .custom-scroll::-webkit-scrollbar, .flex-1::-webkit-scrollbar { width: 6px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.2); border-radius: 10px; }
        .flex-1::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.1); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="glass-card w-full max-w-6xl overflow-hidden flex flex-col md:flex-row min-h-[700px] md:h-[700px]">
        
        <div class="w-full md:w-80 bg-indigo-700 p-6 text-white flex flex-col justify-between">
            <div>
                <div class="mb-8">
                    <h1 class="text-2xl font-bold tracking-tight">🤖 AgentHub</h1>
                    <p class="text-indigo-200 text-xs">Custom Agent Factory</p>
                </div>

                <button onclick="showCreateForm()" class="w-full mb-6 bg-white text-indigo-700 font-bold py-3 rounded-xl hover:bg-indigo-50 transition-all shadow-md">
                    + Create New Agent
                </button>

                <p class="text-[10px] uppercase font-black text-indigo-300 mb-3 tracking-widest">Your Agents</p>
                <nav id="agentList" class="space-y-2 max-h-[350px] overflow-y-auto custom-scroll">
                    </nav>
            </div>
        </div>

            <div class="border-t border-indigo-500 pt-6">
                <div id="statusIndicator" class="flex items-center space-x-3 bg-indigo-800 p-4 rounded-2xl">
                    <div id="statusDot" class="w-3 h-3 bg-yellow-400 rounded-full animate-pulse"></div>
                    <div>
                        <p id="statusText" class="text-xs font-bold uppercase">Connecting...</p>
                        <p class="text-[10px] text-indigo-300">Server: localhost:8000</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex-1 p-8 flex flex-col bg-white overflow-y-auto"> 
            
            <div id="createAgentForm" class="hidden animate-fade-in">
                <header class="mb-6">
                    <h2 class="text-2xl font-bold text-gray-800">Build a New Agent</h2>
                    <p class="text-gray-500 text-sm">Define your agent's name and personality (System Prompt).</p>
                </header>
                <div class="space-y-4">
                    <input type="text" id="newAgentName" placeholder="Agent Name (e.g. Python Guru)" class="w-full p-4 bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500">
                    <textarea id="newAgentPrompt" rows="6" placeholder="System Prompt: Describe how this agent should behave..." class="w-full p-4 bg-gray-50 border rounded-xl outline-none focus:ring-2 focus:ring-indigo-500"></textarea>
                    <button onclick="saveAgent()" class="w-full bg-green-600 text-white font-bold py-4 rounded-xl hover:bg-green-700 shadow-lg">Save & Create Agent</button>
                </div>
            </div>

            <div id="chatInterface">
                <header class="mb-6">
                    <h2 id="activeAgentName" class="text-2xl font-bold text-gray-800">Select an Agent</h2>
                    <p id="activeAgentDesc" class="text-gray-500 text-sm">Choose an agent from the sidebar to start.</p>
                </header>

                <div class="space-y-4">
                    <textarea id="userInput" 
                        rows="5" 
                        style="resize: none;" 
                        class="w-full min-h-[160px] p-5 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 outline-none transition-all" 
                        placeholder="Enter your message..."></textarea>
    
                    <button onclick="runAgent()" id="genBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 rounded-2xl transition-all shadow-lg flex justify-center items-center space-x-2">
                        <span>Send Message</span>
                    </button>
                </div>

                <div id="resultContainer" class="mt-8 hidden space-y-4">
                    <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                        <h3 class="text-gray-400 text-xs font-black uppercase tracking-widest">AI Response</h3>
                        <button onclick="copyToClipboard()" class="text-indigo-600 text-xs font-bold hover:underline">📋 Copy</button>
                    </div>
                    <div id="outputCard" class="bg-indigo-50 p-6 rounded-2xl border border-indigo-100">
                        <div id="resBody" 
                            style="overflow-wrap: break-word; word-wrap: break-word; hyphens: auto;" 
                            class="text-gray-700 text-sm leading-relaxed whitespace-pre-wrap">
                        </div>
                    </div>
                </div>
            </div>

            <div id="loader" class="mt-20 hidden flex flex-col items-center">
                <div class="loading-spinner"></div>
                <p class="mt-4 text-gray-500 text-sm font-medium animate-pulse">Processing request...</p>
            </div>
        </div>

    </div>
</div>

    <script>
        const ws = new WebSocket("ws://localhost:8000/ws");
        let editingAgentId = null;
        let currentAgent = null;

        ws.onopen = () => {
            document.getElementById('statusText').innerText = "System Online";
            document.getElementById('statusDot').className = "w-3 h-3 bg-green-400 rounded-full";
        };

        window.onload = () => {
            loadAgentsList();
        };

        async function loadAgentsList() {
            try {
                const response = await fetch('/get_agents');
                const data = await response.json();
                
                const nav = document.getElementById('agentList');
                nav.innerHTML = "";

                if (data.agents && data.agents.length > 0) {
                    data.agents.forEach(agent => {
                        addAgentToSidebar(agent.id, agent.name); 
                    });
                    console.log("Sidebar synced with database.");
                } else {
                    nav.innerHTML = "<p class='text-xs text-indigo-300 p-4'>No agents found.</p>";
                }
            } catch (err) {
                console.error("Agents load nahi ho sakay:", err);
            }
        }

        function showCreateForm() {
            editingAgentId = null;
            document.getElementById('newAgentName').value = "";
            document.getElementById('newAgentPrompt').value = "";
            document.getElementById('userInput').value = "";

            document.getElementById('chatInterface').classList.add('hidden');
            document.getElementById('createAgentForm').classList.remove('hidden');
        }

        function editAgent(id) {
            console.log("Fetching details for Agent ID:", id);
            
            // Backend se is specific ID ka data mangwa rahe hain
            ws.send(JSON.stringify({
                type: "get_agent_details",
                agent_id: id
            }));
        }

        function saveAgent() {
            const name = document.getElementById('newAgentName').value;
            const prompt = document.getElementById('newAgentPrompt').value;
            
            if(!name || !prompt) return alert("Please fill all fields");

            // WebSocket ko data bhejte waqt ID bhi shamil karein
            ws.send(JSON.stringify({
                type: "create_agent",
                id: editingAgentId, // Agar edit kar rahe hain toh ID jayegi, warna null
                name: name,
                prompt: prompt
            }));

            // Save karne ke baad editing ID ko reset kar dena chahiye
            editingAgentId = null;
        }

        function runAgent() {
            if(!currentAgent) return alert("Select an agent first!");
            const text = document.getElementById('userInput').value;
            if(!text) return alert("Enter some text");

            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('resultContainer').classList.add('hidden');

            ws.send(JSON.stringify({
                type: "run_agent",
                agent_name: currentAgent,
                text: text
            }));
        }

        document.getElementById('userInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                runAgent();
            }
        } catch (e) { console.error("Failed to load agents:", e); }
    }

    // ── Views ──
    function showView(view) {
        ['emptyState','chatInterface','createAgentForm'].forEach(id =>
            document.getElementById(id).classList.add('hidden'));
        document.getElementById(view).classList.remove('hidden');
    }

    function showCreateForm(isEdit = false) {
        editingAgentId = null;
        document.getElementById('newAgentName').value = "";
        document.getElementById('newAgentPrompt').value = "";
        document.getElementById('formTitle').innerText = isEdit ? "Edit Agent" : "Build a New Agent";
        showView('createAgentForm');
    }

    function cancelForm() {
        showView(currentAgent ? 'chatInterface' : 'emptyState');
    }

    function editCurrentAgent() { if (currentAgentId) editAgent(currentAgentId); }
    function deleteCurrentAgent() { if (currentAgentId && currentAgent) deleteAgent(currentAgentId, currentAgent); }

    function editAgent(id) {
        ws.send(JSON.stringify({ type: "get_agent_details", agent_id: id }));
    }

    function saveAgent() {
        const name = document.getElementById('newAgentName').value.trim();
        const prompt = document.getElementById('newAgentPrompt').value.trim();
        if (!name || !prompt) { showToast("Please fill in all fields.", "error"); return; }
        ws.send(JSON.stringify({ type: "create_agent", id: editingAgentId, name, prompt }));
        editingAgentId = null;
    }

    function runAgent() {
        if (!currentAgent) { showToast("Select an agent first.", "error"); return; }
        const text = document.getElementById('userInput').value.trim();
        if (!text) return;

        appendMessage('user', text);
        document.getElementById('userInput').value = "";
        autoResize(document.getElementById('userInput'));
        document.getElementById('loader').classList.remove('hidden');
        scrollToBottom();

        ws.send(JSON.stringify({ type: "run_agent", agent_name: currentAgent, text }));
    }

    // ── WS messages ──
    ws.onmessage = (event) => {
        const data = JSON.parse(event.data);
        ({
            "agent_created": () => {
                loadAgentsList();
                showToast(`"${data.name}" created!`, "success");
                selectAgent(data.id, data.name);
            },
            "agent_updated": () => {
                loadAgentsList();
                currentAgent = data.name;
                document.getElementById('activeAgentName').innerText = data.name;
                showView('chatInterface');
                showToast(`"${data.name}" updated!`, "success");
            },
            "agent_deleted": () => {
                loadAgentsList();
                currentAgent = null; currentAgentId = null;
                document.getElementById('activeAgentName').innerText = "Select an Agent";
                document.getElementById('activeAgentDesc').innerText = "Choose an agent from the sidebar";
                document.getElementById('headerActions').classList.add('hidden');
                showView('emptyState');
                showToast("Agent deleted.", "info");
            },
            "agent_details": () => {
                document.getElementById('formTitle').innerText = "Edit Agent";
                document.getElementById('newAgentName').value = data.name;
                document.getElementById('newAgentPrompt').value = data.prompt;
                editingAgentId = data.id;
                showView('createAgentForm');
            },
            "ai_output": () => {
                document.getElementById('loader').classList.add('hidden');
                appendMessage('ai', data.response);
            },
            "error": () => {
                document.getElementById('loader').classList.add('hidden');
                showToast(data.message, "error");
            }
        }[data.type] || (() => {}))();
    };

    // ── Sidebar ──
    const avatarColors = ['bg-violet-500','bg-blue-500','bg-emerald-500','bg-orange-500','bg-pink-500','bg-cyan-500','bg-rose-500','bg-teal-500'];

    function addAgentToSidebar(id, name) {
        const nav = document.getElementById('agentList');
        const initials = name.slice(0, 2).toUpperCase();
        const color = avatarColors[name.charCodeAt(0) % avatarColors.length];

        const item = document.createElement('div');
        item.className = "agent-item group relative flex items-center p-2 rounded-xl cursor-pointer";
        item.id = `agent-item-${id}`;
        item.innerHTML = `
            <div class="agent-avatar ${color} text-white mr-2 text-[11px]">${initials}</div>
            <span class="text-white/60 text-[13px] font-medium truncate flex-1 group-[.active]:text-white/90">${name}</span>
            <div class="flex items-center space-x-0.5 opacity-0 group-hover:opacity-100 transition-opacity flex-shrink-0">
                <button onclick="editAgent('${id}'); event.stopPropagation();" title="Edit"
                    class="p-1 text-white/25 hover:text-yellow-400 rounded transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
                </button>
                <button onclick="deleteAgent('${id}','${name}'); event.stopPropagation();" title="Delete"
                    class="p-1 text-white/25 hover:text-red-400 rounded transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                </button>
            </div>`;
        item.onclick = () => selectAgent(id, name);
        nav.appendChild(item);
    }

    function selectAgent(id, name) {
        currentAgent = name; currentAgentId = id;
        document.querySelectorAll('.agent-item').forEach(el => el.classList.remove('active'));
        const item = document.getElementById(`agent-item-${id}`);
        if (item) item.classList.add('active');

        document.getElementById('activeAgentName').innerText = name;
        document.getElementById('activeAgentDesc').innerText = "Ready to chat";
        document.getElementById('headerActions').classList.remove('hidden');
        document.getElementById('chatMessages').innerHTML = "";
        document.getElementById('loader').classList.add('hidden');
        showView('chatInterface');

        // Welcome message
        appendSystemMsg(`You are now chatting with <strong>${name}</strong>. Send a message to begin.`);
    }

    // ── Messages ──
    function appendMessage(role, content) {
        const container = document.getElementById('chatMessages');
        const wrap = document.createElement('div');
        wrap.className = `flex fade-in ${role === 'user' ? 'justify-end' : 'items-end space-x-2'}`;

        if (role === 'user') {
            wrap.innerHTML = `<div class="user-bubble px-4 py-2.5 max-w-[72%] text-sm leading-relaxed">${escapeHtml(content)}</div>`;
        } else {
            wrap.innerHTML = `
                <div class="w-7 h-7 rounded-full bg-indigo-100 flex items-center justify-center flex-shrink-0 self-start mt-0.5">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-indigo-500" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                </div>
                <div class="ai-bubble px-4 py-3 max-w-[72%] text-sm">
                    <div class="prose text-gray-700">${marked.parse(content)}</div>
                    <button onclick="copyText(this)" data-text="${encodeURIComponent(content)}"
                        class="mt-2 text-gray-300 hover:text-gray-500 text-[10px] flex items-center space-x-1 transition-colors">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                        <span>Copy</span>
                    </button>
                </div>`;
        }
        container.appendChild(wrap);
        scrollToBottom();
    }

    function appendSystemMsg(html) {
        const container = document.getElementById('chatMessages');
        const el = document.createElement('div');
        el.className = "text-center text-[11px] text-gray-400 fade-in py-1";
        el.innerHTML = html;
        container.appendChild(el);
    }

    function escapeHtml(t) {
        return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function scrollToBottom() {
        const c = document.getElementById('chatMessages');
        requestAnimationFrame(() => c.scrollTop = c.scrollHeight);
    }

    // ── Delete ──
    function deleteAgent(id, name) {
        if (confirm(`Delete "${name}"? All conversation history will be removed.`)) {
            ws.send(JSON.stringify({ type: "delete_agent", agent_id: id }));
        }
    }

    // ── Copy ──
    function copyText(btn) {
        navigator.clipboard.writeText(decodeURIComponent(btn.dataset.text)).then(() => {
            btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg><span>Copied!</span>`;
            btn.classList.add('text-green-500');
            setTimeout(() => {
                btn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" class="w-3 h-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg><span>Copy</span>`;
                btn.classList.remove('text-green-500');
            }, 1500);
        });
    }

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);

            const actions = {
                "agent_created": () => {
                    addAgentToSidebar(data.id, data.name);
                    const newBtn = document.getElementById('agentList').firstChild.querySelector('.nav-btn');
                    selectAgent(data.id, data.name, newBtn);
                },

                "agent_updated": () => {
                    loadAgentsList();
                    currentAgent = data.name;
                    document.getElementById('activeAgentName').innerText = data.name;
                    document.getElementById('resultContainer').classList.add('hidden');
                    document.getElementById('createAgentForm').classList.add('hidden');
                    document.getElementById('chatInterface').classList.remove('hidden');
                },

                "agent_deleted": () => {
                    loadAgentsList();
                    currentAgent = null;
                    editingAgentId = null;
                    document.getElementById('activeAgentName').innerText = "Select an Agent";
                    document.getElementById('activeAgentDesc').innerText = "Choose an agent from the sidebar to start.";
                    document.getElementById('resultContainer').classList.add('hidden');
                    document.getElementById('createAgentForm').classList.add('hidden');
                    document.getElementById('chatInterface').classList.remove('hidden');
                },

                "agent_details": () => {
                    showCreateForm(); // Open form and set editing mode
                    document.getElementById('newAgentName').value = data.name;
                    document.getElementById('newAgentPrompt').value = data.prompt;
                    editingAgentId = data.id; // SET Global editing ID
                },

                "ai_output": () => {
                    document.getElementById('loader').classList.add('hidden');
                    document.getElementById('resultContainer').classList.remove('hidden');
                    document.getElementById('resBody').innerHTML = marked.parse(data.response);
                },

                "error": () => {
                    document.getElementById('loader').classList.add('hidden');
                    alert("Error: " + data.message);
                }
            };

            // jo data.type backend se aaya hai, usay chalao
            if (actions[data.type]) {
                actions[data.type]();
            }
        };
        inner.className = `px-4 py-2.5 rounded-xl shadow-xl text-sm font-medium flex items-center space-x-2 ${styles[type]}`;
        inner.innerHTML = `${icons[type]}<span>${message}</span>`;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3000);
    }

        function addAgentToSidebar(id, name) {
            const nav = document.getElementById('agentList');
            
            const container = document.createElement('div');
            container.className = "group relative flex items-center w-full mb-2";

            const btn = document.createElement('button');
            btn.className = "nav-btn w-full flex items-center space-x-3 p-4 rounded-xl hover:bg-indigo-600 opacity-80 text-left transition-all pr-16";
            
            // User ko ID dikhani nahi hai, bas function mein pass karni hai
            btn.innerHTML = `
                <span class="font-medium truncate">${name}</span>
            `;
            btn.onclick = () => selectAgent(id, name, btn);

            const actions = document.createElement('div');
            actions.className = "absolute right-2 flex space-x-1 opacity-0 group-hover:opacity-100 transition-opacity";
            actions.innerHTML = `
                <button onclick="editAgent('${id}')" class="p-1 hover:text-yellow-400">✏️</button>
                <button onclick="deleteAgent('${id}', '${name}')" class="p-1 hover:text-red-400">🗑️</button>
            `;

            container.appendChild(btn);
            container.appendChild(actions);
            nav.insertBefore(container, nav.firstChild);
        }

        function selectAgent(id, name, element) {
            currentAgent = name;
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active', 'opacity-100'));
            element.classList.add('active', 'opacity-100');
            
            document.getElementById('activeAgentName').innerText = name;
            document.getElementById('userInput').value = "";
            document.getElementById('activeAgentDesc').innerText = "Dynamic Agent active and ready.";
            document.getElementById('chatInterface').classList.remove('hidden');
            document.getElementById('createAgentForm').classList.add('hidden');
            document.getElementById('resultContainer').classList.add('hidden');
        }

        function copyToClipboard() {
            const body = document.getElementById('resBody').innerText;
            const btn = document.querySelector('button[onclick="copyToClipboard()"]');

            navigator.clipboard.writeText(body).then(() => {
                const originalText = btn.innerHTML;
                
                btn.innerHTML = "<span>✅ Copied!</span>";
                btn.classList.add('text-green-400');
                
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.remove('text-green-400');
                }, 1500);
            });
        }

        function deleteAgent(id, name) {
            if(confirm(`Are you sure you want to delete '${name}'?`)) {
                ws.send(JSON.stringify({
                    type: "delete_agent",
                    agent_id: id // Backend ID expect kar raha hai
                }));
            }
        }
    </script>
</body>
</html>
