<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Agent Multi-Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.2);
        }
        .nav-btn {
            transition: all 0.3s ease;
            border-left: 4px solid transparent;
        }
        .nav-btn.active {
            background: rgba(255, 255, 255, 0.15);
            border-left: 4px solid white;
            opacity: 1;
        }
        .loading-spinner {
            border: 4px solid rgba(0, 0, 0, 0.1);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border-left-color: #4f46e5;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="p-4">

    <div class="glass-card w-full max-w-5xl overflow-hidden flex flex-col md:flex-row min-h-[650px] md:h-[650px]">
        
        <div class="w-full md:w-80 bg-indigo-700 p-6 text-white flex flex-col justify-between">
            <div>
                <div class="mb-8">
                    <h1 class="text-2xl font-bold tracking-tight">🤖 AgentHub</h1>
                    <p class="text-indigo-200 text-xs">Multi-Agent Intelligence System</p>
                </div>

                <nav class="space-y-3">
                    <button onclick="switchAgent('email')" id="nav-email" class="nav-btn active w-full flex items-center space-x-3 p-4 rounded-xl hover:bg-indigo-600">
                        <span>✉️</span>
                        <span class="font-medium">Email Drafter</span>
                    </button>
                    
                    <button onclick="switchAgent('prompt')" id="nav-prompt" class="nav-btn w-full flex items-center space-x-3 p-4 rounded-xl hover:bg-indigo-600 opacity-60">
                        <span>🚀</span>
                        <span class="font-medium">Prompt Improver</span>
                    </button>
                </nav>
            </div>

            <div class="border-t border-indigo-500 pt-6">
                <div id="statusIndicator" class="flex items-center space-x-3 bg-indigo-800 p-4 rounded-2xl shadow-inner">
                    <div id="statusDot" class="w-3 h-3 bg-yellow-400 rounded-full animate-pulse"></div>
                    <div>
                        <p id="statusText" class="text-xs font-bold uppercase tracking-widest">Connecting...</p>
                        <p class="text-[10px] text-indigo-300">Server: localhost:8000</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="flex-1 p-8 flex flex-col bg-white overflow-y-auto">
            <header class="mb-6">
                <h2 id="agentHeader" class="text-2xl font-bold text-gray-800">New Email Draft</h2>
                <p id="agentSub" class="text-gray-500 text-sm">Describe your situation to generate a professional email.</p>
            </header>

            <div class="space-y-4">
                <textarea id="userInput" 
                    rows="5"
                    class="w-full min-h-[160px] p-5 bg-gray-50 border border-gray-200 rounded-2xl focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition-all text-gray-700 placeholder-gray-400"
                    placeholder="Describe the situation..."></textarea>
                
                <button onclick="sendRequest()" id="genBtn"
                    class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-6 rounded-2xl transition-all shadow-lg flex justify-center items-center space-x-2">
                    <span id="btnText">Generate Professional Email</span>
                </button>
            </div>

            <div id="resultContainer" class="mt-8 hidden space-y-4">
                <div class="flex justify-between items-center border-b border-gray-100 pb-2">
                    <h3 class="text-gray-400 text-xs font-black uppercase tracking-widest">AI Result</h3>
                    <button onclick="copyToClipboard()" class="text-indigo-600 text-xs font-bold hover:underline">📋 Copy Result</button>
                </div>
                
                <div id="outputCard" class="bg-indigo-50 p-6 rounded-2xl border border-indigo-100 shadow-sm">
                    <div class="mb-3 text-indigo-800 font-bold text-lg" id="resSubject"></div>
                    <div class="text-gray-700 text-sm leading-relaxed whitespace-pre-line" id="resBody"></div>
                    <div class="mt-4 font-semibold text-gray-900 border-t border-indigo-100 pt-3" id="resClosing"></div>
                </div>
            </div>

            <div id="loader" class="mt-20 hidden flex flex-col items-center">
                <div class="loading-spinner"></div>
                <p id="loaderText" class="mt-4 text-gray-500 text-sm font-medium animate-pulse">Llama 3 is thinking...</p>
            </div>
        </div>
    </div>

    <script>
        const ws = new WebSocket("ws://localhost:8000/ws");
        const statusText = document.getElementById('statusText');
        const statusDot = document.getElementById('statusDot');
        const btnText = document.getElementById('btnText');
        const genBtn = document.getElementById('genBtn');
        const userInput = document.getElementById('userInput');
        
        // --- PROBLEM 4: Separate Storage Logic ---
        let emailInputStorage = "";
        let promptInputStorage = "";
        let currentAgent = 'email';

        ws.onopen = () => {
            statusText.innerText = "Connected to Agent";
            statusDot.classList.replace('bg-yellow-400', 'bg-green-400');
            statusDot.classList.remove('animate-pulse');
        };

        ws.onclose = () => {
            statusText.innerText = "Connection Lost";
            statusDot.classList.replace('bg-green-400', 'bg-red-500');
            statusDot.classList.add('animate-pulse');
        };

        // --- PROBLEM 3: Enter Key Logic ---
        userInput.addEventListener('keydown', function(event) {
            // Check if Enter is pressed without Shift
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault(); // Stop newline from being created
                sendRequest(); // Trigger the generate button logic
            }
        });

        function switchAgent(agent) {
            // Save current text before switching
            if (currentAgent === 'email') {
                emailInputStorage = userInput.value;
            } else {
                promptInputStorage = userInput.value;
            }

            currentAgent = agent;
            
            // UI update logic
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.remove('active', 'opacity-100');
                btn.classList.add('opacity-60');
            });
            const activeBtn = document.getElementById(`nav-${agent}`);
            activeBtn.classList.add('active', 'opacity-100');
            activeBtn.classList.remove('opacity-60');
            
            const header = document.getElementById('agentHeader');
            const sub = document.getElementById('agentSub');

            if(agent === 'email') {
                header.innerText = "New Email Draft";
                sub.innerText = "Describe your situation to generate a professional email.";
                btnText.innerText = "Generate Professional Email";
                userInput.placeholder = "Example: Requesting a sick leave from my boss...";
                userInput.value = emailInputStorage; // Load Email text
            } else {
                header.innerText = "Prompt Improver";
                sub.innerText = "Transform your basic prompt into a high-quality engineering prompt.";
                btnText.innerText = "Improve My Prompt";
                userInput.placeholder = "Example: Give me a 5-minute workout...";
                userInput.value = promptInputStorage; // Load Prompt text
            }
            
            document.getElementById('resultContainer').classList.add('hidden');
        }

        function sendRequest() {
            const input = userInput.value;
            if (!input) return alert("Please enter some text!");

            document.getElementById('resultContainer').classList.add('hidden');
            document.getElementById('loader').classList.remove('hidden');
            genBtn.disabled = true;
            genBtn.style.opacity = '0.6';

            ws.send(JSON.stringify({ agent: currentAgent, text: input }));
        }

        ws.onmessage = (event) => {
            const data = JSON.parse(event.data);
            console.log("Response from Server:", data);

            document.getElementById('loader').classList.add('hidden');
            document.getElementById('resultContainer').classList.remove('hidden');
            genBtn.disabled = false;
            genBtn.style.opacity = '1';

            const resSubject = document.getElementById('resSubject');
            const resBody = document.getElementById('resBody');
            const resClosing = document.getElementById('resClosing');

            if (currentAgent === 'email') {
                resSubject.classList.remove('hidden');
                resClosing.classList.remove('hidden');
                resSubject.innerText = "Subject: " + (data.subject || "No Subject");
                resBody.innerText = data.body || "No Body Generated";
                resClosing.innerText = data.closing || "Best regards,";
            } else {
                resSubject.classList.add('hidden');
                resClosing.classList.add('hidden');

                let finalResult = "No Improvement Generated";

                // Backend se clean text handling
                if (data.improved_prompt) {
                    if (typeof data.improved_prompt === "string") {
                        finalResult = data.improved_prompt;
                    } 
                    else if (typeof data.improved_prompt === "object") {
                        finalResult = JSON.stringify(data.improved_prompt, null, 2);
                    }
                } 
                else if (typeof data === 'string') {
                    finalResult = data;
                } 
                else if (data.response) {
                    finalResult = data.response;
                }

                resBody.innerText = finalResult;
            }
        };

        function copyToClipboard() {
            const body = document.getElementById('resBody').innerText;
            navigator.clipboard.writeText(body).then(() => alert("Copied!"));
        }
    </script>
</body>
</html>
